<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDK Medicinas</title>
    <!-- Enlace de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styleSeleccionMedicinas.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container-fluid">
        <!-- Columna del ticket -->
        <div class="ticket" style="overflow: hidden; display: flex; flex-direction: column;">
            <div style="overflow-y: auto; flex-grow: 1;">
                <h5><strong>Ticket</strong></h5>
                <p id="ClienteTicket"><strong>Cliente: Público en general</strong></p>

                <div class="productos-contenedor">
                    <div class="item">
                        <!-- Aquí irían los productos -->
                    </div>
                </div> <!-- Contenedor para los productos -->
            </div>
            <div class="mt-auto">
            </div>
            <div class="d-grid mt-3" style="position: sticky; bottom: 0; z-index: 1;">
                <button class="btn btn-primary me-1 rounded">Pagar</button>
            </div>
           
        </div>

        <!-- Sección de productos y título -->
        <div class="products-section-wrapper">
            <div class="d-flex justify-content-end mb-2">
                <button id="btnAgregarCliente" class="btn btn-primary rounded">Clientes</button>
            </div>
            <div class="d-flex justify-content-end mb-2">
                <button id="btnSalir" class="btn btn-primary rounded">Salir</button>
               </div>
            <!-- Parte superior: Título MDK Medicinas -->
            <h2><strong>MDK MEDICINAS</strong></h2>
            <div class="products-section-top">
                <div class="mb-4">
                    <label for="buscarCliente" class="form-label">Buscar Cliente</label>
                    <div class="d-flex align-items-center">
                        <input type="text" id="buscarCliente" class="form-control me-2"
                            placeholder="Ingrese el nombre del cliente" style="flex: 1;">
                        <button id="btnBuscarCliente" class="btn btn-primary me-1 rounded">Buscar</button>
                        <button id="btnLimpiarCliente" class="btn btn-primary rounded">Limpiar</button>
                    </div>
                </div>
                <div>
                    <label for="buscarProducto" class="form-label">Buscar Producto</label>
                    <div class="d-flex align-items-center">
                        <input type="text" id="buscarProducto" class="form-control me-2"
                            placeholder="Ingrese el nombre del producto" style="flex: 1;">
                    </div>
                </div>
            </div>



            <!-- Parte inferior: Tabla con scroll -->
            <div class="products-section-bottom">
                <div class="row">
                    <div class="col-md-4">
                        <div class="product">
                            <h6>Paracetamol</h6>
                            <p>$20</p>
                            <div class="d-flex justify-content-center">
                                <button class="btn btn-outline-primary">-</button>
                                <input type="text" value="2" class="form-control mx-2 text-center" style="width: 50px;">
                                <button class="btn btn-outline-primary">+</button>
                            </div>
                        </div>
                    </div>


                    <!-- Agrega más productos según sea necesario -->
                </div>
            </div>
        </div>
    </div>

    <!-- Enlace a Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../controles/controlSeleccionMedicinas.js"></script>
    <script src="../controles/controlCliente.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        document.getElementById('btnAgregarCliente').addEventListener('click', function () {
            window.location.href = '../views/clientes.html';
        });
        document.getElementById('btnSalir').addEventListener('click', function () {
            window.location.href = '../views/login.html';
        });
    </script>
</body>

</html>
