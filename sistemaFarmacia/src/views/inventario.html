<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDK Medicinas</title>
    <!-- Enlace de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="./css/styleInventario.css">
</head>

<body>
    <div class="container-fluid centered-content">
        <!-- Columna del ticket -->

        <!-- Sección de productos y título -->
        <div class="products-section-wrapper">
            <div class="d-flex justify-content-end mb-2">
                <button id="btnNuevoPersonal" class="btn btn-primary rounded">Nuevo personal</button>
            </div>
            <!-- Parte superior: Título MDK Medicinas -->
            <h2><strong>MDK MEDICINAS</strong></h2>
            <div class="products-section-top">
                <div>
                    <label for="buscarProducto" class="form-label">Buscar Producto</label>
                    <div class="d-flex align-items-center">
                        <input type="text" id="buscarProducto" class="form-control me-2"
                            placeholder="Ingrese el nombre del producto" style="flex: 1;">
                            <button class="btn btn-primary rounded me-2">Buscar</button> <!-- Margen derecho agregado aquí -->
                            <button class="btn btn-primary rounded">Nuevo</button>
                    </div>
                </div>
            </div>



            <!-- Parte inferior: Tabla con scroll -->
            <div class="products-section-bottom">
                <div class="row">
                    <div class="col-md-4">

                    </div>


                    <!-- Agrega más productos según sea necesario -->
                </div>
            </div>
        </div>
    </div>

    <!-- Enlace a Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../controles/controlInventario.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        document.getElementById('btnNuevoPersonal').addEventListener('click', function () {
            window.location.href = '../views/register.html';
        });
    </script>
</body>

</html>
