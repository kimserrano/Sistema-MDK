<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- Enlace de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/stylesLogin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row">
            <div class="col-md-12">

                <h1 class="text-center mb-4">Iniciar Sesión</h1>
                <form>
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario:</label>
                        <input type="text" class="form-control" id="usuario" name="usuario" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña:</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Entrar</button>
                    </div>
                    <p class="text-center mt-3 register-link">
                        ¿Nuevo personal? Pídele al administrador que te registre <a href="#" data-bs-toggle="modal"
                            data-bs-target="#registerRequestModal">aquí</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
    <!-- Enlace a Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Modal para Solicitud de Registro (Iniciar Sesión como Administrador) -->
    <div class="modal fade" id="registerRequestModal" tabindex="-1" aria-labelledby="registerRequestModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="registerRequestModalLabel">Iniciar Sesión como Administrador</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p>Para registrar una nueva cuenta, inicie sesión como administrador.</p>
                    <form>
                        <div class="mb-3">
                            <label for="adminUser" class="form-label">Usuario:</label>
                            <input type="text" class="form-control" id="adminUser" name="adminUser"
                                placeholder="Usuario" required>
                        </div>
                        <div class="mb-3">
                            <label for="adminPassword" class="form-label">Contraseña:</label>
                            <input type="password" class="form-control" id="adminPassword" name="adminPassword"
                                placeholder="Contraseña" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary">Iniciar Sesión</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../controles/controlLogin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
